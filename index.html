  <title>Portal</title>
  <meta name="theme-color" content="#11131a">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    :root,
    :root[data-theme="dark"] {
      color-scheme: dark;
      --gradient-bg-main: linear-gradient(135deg, #11131a, #18131a);
      --bg-card: rgba(26, 28, 40, 0.7);
      --bg-btn-default: rgba(30, 34, 48, 0.8);
      --bg-btn-hover: rgba(45, 50, 70, 0.9);
      --border-card: rgba(255, 255, 255, 0.08);
      --border-btn: rgba(255, 255, 255, 0.05);
      --text-primary: #e0e0e0;
      --text-white: #fff;
      --text-gray-light: #c5cde7;
      --text-gray-dark: #6b7280;
      --divider-color: #2d303d;
      --divider-fade: rgba(45, 48, 61, 0.7);
      --divider-glow-strong: rgba(210, 220, 255, 0.7);
      --divider-glow-soft: rgba(210, 220, 255, 0.3);
      --radius-card: 24px;
      --radius-btn: 14px;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --gradient-bg-main: linear-gradient(135deg, #eef1f8, #f6eff4);
      --bg-card: rgba(255, 255, 255, 0.78);
      --bg-btn-default: rgba(233, 236, 245, 0.85);
      --bg-btn-hover: rgba(206, 213, 232, 0.95);
      --border-card: rgba(0, 0, 0, 0.08);
      --border-btn: rgba(0, 0, 0, 0.05);
      --text-primary: #333a4d;
      --text-white: #1b2130;
      --text-gray-light: #4b5673;
      --text-gray-dark: #8b93a8;
      --divider-color: #cdd3e4;
      --divider-fade: rgba(150, 158, 182, 0.7);
      --divider-glow-strong: rgba(88, 108, 190, 0.5);
      --divider-glow-soft: rgba(88, 108, 190, 0.2);
      --radius-card: 24px;
      --radius-btn: 14px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--gradient-bg-main);
      color: var(--text-primary);
      padding: 10px;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 480px;
      padding: 56px 40px 44px;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-card);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      position: relative;
      will-change: transform;
    }

    .info {
      text-align: center;
      margin-top: -8px;
    }

    .name {
      font-size: 32px;
      font-weight: 600;
      color: var(--text-white);
      margin-bottom: 16px;
    }

    .bio {
      font-size: 17px;
      font-weight: 400;
      line-height: 1.4;
      background: linear-gradient(90deg, var(--text-gray-light), var(--text-white));
      background-size: 300% 100%;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: textGradient 1.4s ease-out forwards;
    }

    .divider {
      width: 100%;
      max-width: 400px;
      height: 2px;
      margin: 0 auto;
      border: none;
      position: relative;
      overflow: hidden;
      background: radial-gradient(
        ellipse at center,
        var(--divider-color) 0%,
        var(--divider-color) 35%,
        var(--divider-fade) 60%,
        transparent 100%
      );
    }

    .divider::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse at center,
        var(--divider-glow-strong) 0%,
        var(--divider-glow-soft) 35%,
        transparent 100%
      );
      transform: scaleX(0);
      transform-origin: center;
      animation: dividerFade 1.4s ease-out forwards;
    }

    @keyframes textGradient {
      0% { background-position: -300% 0; }
      100% { background-position: 0; }
    }

    @keyframes dividerFade {
      0% { transform: scaleX(0); opacity: 1; }
      50% { opacity: 1; }
      100% { transform: scaleX(1); opacity: 0; }
    }

    .links {
      width: 100%;
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      width: 110px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      background: var(--bg-btn-default);
      border: 1px solid var(--border-btn);
      border-radius: var(--radius-btn);
      color: var(--text-primary);
      font-size: 15px;
      text-decoration: none;
      transition: all 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:hover {
      background: var(--bg-btn-hover);
      color: var(--text-white);
      transform: translateY(-2px);
    }

    .social {
      display: flex;
      gap: 26px;
      align-items: center;
      justify-content: center;
    }

    .social a {
      color: var(--text-gray-light);
      font-size: 18px;
      text-decoration: none;
      transition: color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .social a:hover {
      color: var(--text-white);
    }

    .theme-switcher {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px;
      background: var(--bg-btn-default);
      border: 1px solid var(--border-btn);
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
      cursor: pointer;
    }

    .theme-btn {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text-gray-dark);
      font-size: 11px;
      cursor: pointer;
      transition: opacity 0.2s ease, width 0.25s ease, margin 0.25s ease, background 0.2s ease, color 0.2s ease;
      overflow: hidden;
      opacity: 0;
      width: 0;
    }

    .theme-switcher.open .theme-btn,
    .theme-btn.active {
      opacity: 1;
      width: 24px;
      margin: 0 1px;
    }

    .theme-btn:hover {
      color: var(--text-white);
      background: var(--bg-btn-hover);
    }

    .theme-btn.active {
      background: var(--bg-btn-hover);
      color: var(--text-white);
    }

    .footer {
      font-size: 11px;
      color: var(--text-gray-dark);
      margin-top: 0;
    }

    .year {
      font-weight: 400;
      color: var(--text-gray-dark);
      transition: none;
    }

    @media (max-width: 480px) {
      .card {
        padding: 40px 20px 30px;
      }
      .divider {
        max-width: calc(100% - 20px);
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="theme-switcher" role="group" aria-label="主题切换">
      <button type="button" class="theme-btn" data-theme-choice="light" title="浅色主题" aria-label="浅色主题"><i class="fa-solid fa-sun"></i></button>
      <button type="button" class="theme-btn" data-theme-choice="system" title="跟随系统" aria-label="跟随系统"><i class="fa-solid fa-display"></i></button>
      <button type="button" class="theme-btn" data-theme-choice="dark" title="深色主题" aria-label="深色主题"><i class="fa-solid fa-moon"></i></button>
    </div>

    <section class="info">
      <h1 class="name">Hello</h1>
      <p class="bio">All systems ready</p>
    </section>

    <hr class="divider">

    <div class="links">
      <a class="btn" href="#">OpenWrt</a>
      <a class="btn" href="#">OpenList</a>
      <a rel="nofollow noopener" class="btn" href="https://pairdrop.net/">PairDrop</a>
      <a class="btn" href="#">链接</a>
      <a class="btn" href="#">链接</a>
      <a rel="nofollow noopener" class="btn" href="http://oooo.sylu.net/">链接</a>
    </div>

    <hr class="divider">

    <div class="social">
      <a rel="nofollow noopener" href="https://github.com/YOUR_GITHUB" target="_blank" title="GitHub"><i class="fa-brands fa-github"></i></a>
      <a rel="nofollow noopener" href="https://t.me/YOUR_TELEGRAM" target="_blank" title="Telegram"><i class="fa-brands fa-telegram"></i></a>
      <a rel="nofollow noopener" href="https://x.com/YOUR_X" target="_blank" title="X"><i class="fa-brands fa-x-twitter"></i></a>
      <a href="mailto:mail@xxx.cloudns.org" title="Email"><i class="fa-solid fa-envelope"></i></a>
    </div>

    <footer class="footer">
      © <span class="year" id="dynamicYear">2026</span> All Rights Reserved
    </footer>
  </div>

  <script>
    (function () {
      var STORAGE_KEY = 'portal-theme';
      var root = document.documentElement;
      var media = window.matchMedia('(prefers-color-scheme: light)');
      var themeColorMeta = document.querySelector('meta[name="theme-color"]');

      function getChoice() {
        var stored = localStorage.getItem(STORAGE_KEY);
        return stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
      }

      function applyTheme(choice) {
        var theme = choice === 'system' ? (media.matches ? 'light' : 'dark') : choice;
        root.setAttribute('data-theme', theme);
        if (themeColorMeta) {
          themeColorMeta.setAttribute('content', theme === 'light' ? '#eef1f8' : '#11131a');
        }
      }

      function syncButtons(choice) {
        document.querySelectorAll('.theme-btn').forEach(function (btn) {
          btn.classList.toggle('active', btn.dataset.themeChoice === choice);
        });
      }

      var switcher = document.querySelector('.theme-switcher');

      switcher.addEventListener('click', function (e) {
        var btn = e.target.closest('.theme-btn');
        if (btn && !btn.classList.contains('active')) {
          var choice = btn.dataset.themeChoice;
          localStorage.setItem(STORAGE_KEY, choice);
          applyTheme(choice);
          syncButtons(choice);
          switcher.classList.remove('open');
        } else {
          switcher.classList.toggle('open');
        }
      });

      document.addEventListener('click', function (e) {
        if (!switcher.contains(e.target)) {
          switcher.classList.remove('open');
        }
      });

      // 系统深浅色变化时，"跟随系统"模式实时响应
      media.addEventListener('change', function () {
        if (getChoice() === 'system') applyTheme('system');
      });

      var initialChoice = getChoice();
      applyTheme(initialChoice);
      syncButtons(initialChoice);

      document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('dynamicYear').textContent = new Date().getFullYear();
      });
    })();
  </script>
</body>

</html>
